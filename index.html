<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام اللعبة والشاشات المتقدم - لوحة المالك</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="app-container">
    <!-- الشريط العلوي للموارد والقيادة -->
    <header class="top-bar">
      <div class="user-resources">
        <span>🪙 <strong id="res-coins">1000</strong></span>
        <span>💎 <strong id="res-gems">50</strong></span>
      </div>
      <nav class="main-nav">
        <button id="nav-worlds" class="nav-btn active">🗺️ العوالم</button>
        <button id="nav-store" class="nav-btn">🛒 المتجر</button>
        <button id="nav-profile" class="nav-btn">👤 البروفايل</button>
        <button id="nav-admin" class="nav-btn admin-badge">👑 المالك</button>
      </nav>
    </header>

    <!-- تسجيل الدخول -->
    <section id="auth-box" class="card">
      <div id="logged-out-view">
        <button id="gmail-login-btn" class="btn-gmail">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
          تسجيل الدخول عبر Gmail
        </button>
      </div>
      <div id="logged-in-view" class="hidden">
        <span id="user-display-name">مرحباً بك!</span>
        <button id="logout-btn" class="btn-danger-sm">خروج</button>
      </div>
    </section>

    <!-- 1. واجهة العوالم والمراحل -->
    <main id="view-worlds" class="view-section">
      <h2>🗺️ العوالم والمراحل</h2>
      <div id="worlds-list-container">
        <!-- يتم توليد العوالم والمراحل ديناميكياً -->
      </div>
    </main>

    <!-- 2. واجهة المتجر -->
    <main id="view-store" class="view-section hidden">
      <h2>🛒 المتجر</h2>
      <div class="sub-tabs">
        <button class="store-tab active" data-cat="avatars">الافاتارات</button>
        <button class="store-tab" data-cat="frames">الإطارات</button>
        <button class="store-tab" data-cat="banners">البنرات</button>
        <button class="store-tab" data-cat="titles">الألقاب</button>
      </div>
      <div id="store-grid" class="grid-container"></div>
    </main>

    <!-- 3. واجهة البروفايل والتجهيز -->
    <main id="view-profile" class="view-section hidden">
      <h2>👤 ملف اللاعب والتخصيص</h2>
      <div class="profile-card">
        <div id="prof-banner" class="banner-box">
          <div class="avatar-wrap">
            <img id="prof-avatar" src="https://via.placeholder.com/80" alt="Avatar">
            <div id="prof-frame" class="frame-box"></div>
          </div>
        </div>
        <div class="prof-info">
          <h3 id="prof-name">لاعب تجريبي</h3>
          <span id="prof-title" class="title-tag">بدون لقب</span>
        </div>
      </div>

      <h3>📦 الحقيبة والعناصر المملوكة</h3>
      <div class="sub-tabs">
        <button class="prof-tab active" data-pcat="avatars">أفاتاراتي</button>
        <button class="prof-tab" data-pcat="frames">إطاراتي</button>
        <button class="prof-tab" data-pcat="banners">بنراتي</button>
        <button class="prof-tab" data-pcat="titles">ألقابي</button>
      </div>
      <div id="inventory-grid" class="grid-container"></div>
    </main>

    <!-- 4. لوحة تحكم المالك (Admin Panel) -->
    <main id="view-admin" class="view-section hidden">
      <h2>👑 لوحة تحكم المالك</h2>
      
      <!-- إضافة عالم جديد -->
      <div class="admin-card">
        <h3>➕ إضافة عالم جديد</h3>
        <input type="text" id="admin-new-world-name" placeholder="اسم العالم (مثال: عالم الغابة)">
        <button id="btn-add-world" class="btn-success">إضافة العالم</button>
      </div>

      <!-- إضافة مرحلة وتحديد الجوائز -->
      <div class="admin-card">
        <h3>🎯 إضافة مرحلة وتعيين الجوائز</h3>
        <select id="admin-select-world">
          <!-- ينزل فيه العوالم المتاحة -->
        </select>
        <input type="text" id="admin-stage-name" placeholder="اسم المرحلة (مثال: المرحلة 1)">
        
        <h4>حدد الجائزة عند الإكمال:</h4>
        <div class="reward-inputs">
          <label>🪙 عملات: <input type="number" id="admin-reward-coins" value="50"></label>
          <label>💎 جواهر: <input type="number" id="admin-reward-gems" value="5"></label>
          <label>🏆 لقب خاص (اختياري): <input type="text" id="admin-reward-title" placeholder="اسم اللقب"></label>
        </div>
        <button id="btn-add-stage" class="btn-success">إضافة المرحلة</button>
      </div>

      <!-- قائمة التعديل والحذف للعوالم والمراحل -->
      <div class="admin-card">
        <h3>⚙️ إدارة وتعديل العوالم والمراحل الحالية</h3>
        <div id="admin-worlds-manager">
          <!-- قائمة الحذف والتعديل المباشر -->
        </div>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
