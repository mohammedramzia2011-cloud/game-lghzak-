<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة لغزاك - Lghzak</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="container">
    
    <!-- الهيدر العلوي -->
    <header class="header">
      <div class="profile-info">
        <img id="header-avatar" src="https://via.placeholder.com/50" alt="Avatar" class="avatar-sm">
        <span id="header-username">لاعب تجريبي</span>
      </div>
      <div class="wallet">
        <span>🪙 <strong id="user-coins">0</strong></span>
        <span>💎 <strong id="user-gems">0</strong></span>
      </div>
    </header>

    <!-- شريط القائمة الرئيسية -->
    <nav class="navbar">
      <button class="nav-btn active" onclick="switchTab('worlds')">العوالم</button>
      <button class="nav-btn" onclick="switchTab('store')">المتجر</button>
      <button class="nav-btn" onclick="switchTab('profile')">البروفايل</button>
      <button class="nav-btn admin-btn" onclick="switchTab('admin')">المالك</button>
    </nav>

    <!-- تسجيل الدخول -->
    <div id="auth-box" class="card">
      <div id="logout-state">
        <button id="google-login-btn" class="btn btn-google">تسجيل الدخول باستخدام Google</button>
      </div>
      <div id="login-state" class="hidden">
        <span>مرحباً: <b id="user-name-display"></b></span>
        <button id="logout-btn" class="btn btn-danger-sm">خروج</button>
      </div>
    </div>

    <!-- قسم العوالم والمراحل -->
    <section id="tab-worlds" class="tab-content">
      <h3>🗺️ العوالم والمراحل</h3>
      <div id="worlds-container"></div>
    </section>

    <!-- قسم المتجر -->
    <section id="tab-store" class="tab-content hidden">
      <h3>🛒 المتجر</h3>
      <div class="sub-tabs">
        <button class="sub-btn active" onclick="switchStoreTab('avatars')">الافتارات</button>
        <button class="sub-btn" onclick="switchStoreTab('frames')">الإطارات</button>
        <button class="sub-btn" onclick="switchStoreTab('banners')">البنرات</button>
        <button class="sub-btn" onclick="switchStoreTab('titles')">الألقاب</button>
      </div>
      <div id="store-items-grid" class="grid"></div>
    </section>

    <!-- قسم البروفايل -->
    <section id="tab-profile" class="tab-content hidden">
      <h3>👤 بطاقة اللاعب والتجهيز</h3>
      
      <div class="profile-card">
        <div id="card-banner" class="banner-box">
          <div class="avatar-box">
            <img id="card-avatar" src="" alt="Avatar">
            <div id="card-frame" class="frame-box"></div>
          </div>
        </div>
        <div class="profile-details">
          <h4 id="card-username">لاعب</h4>
          <span id="card-title" class="title-badge">بدون لقب</span>
        </div>
      </div>

      <h4 style="margin-top: 20px;">المقتنيات المملوكة</h4>
      <div class="sub-tabs">
        <button class="sub-btn active" onclick="switchInvTab('avatars')">افتاراتي</button>
        <button class="sub-btn" onclick="switchInvTab('frames')">إطاراتي</button>
        <button class="sub-btn" onclick="switchInvTab('banners')">بنراتي</button>
        <button class="sub-btn" onclick="switchInvTab('titles')">ألقابي</button>
      </div>
      <div id="inventory-items-grid" class="grid"></div>
    </section>

    <!-- قسم الآدمين (المالك) -->
    <section id="tab-admin" class="tab-content hidden">
      <h3>👑 لوحة التحكم والمالك</h3>

      <!-- إضافة عالم -->
      <div class="card">
        <h4>إضافة عالم جديد</h4>
        <input type="text" id="new-world-title" placeholder="اسم العالم..." class="input-field">
        <button class="btn btn-primary" onclick="addNewWorld()">إضافة العالم</button>
      </div>

      <!-- إضافة مرحلة -->
      <div class="card">
        <h4>إضافة مرحلة</h4>
        <select id="select-world-target" class="input-field"></select>
        <input type="text" id="new-stage-title" placeholder="اسم المرحلة..." class="input-field">
        
        <div class="row">
          <input type="number" id="reward-coins" placeholder="العملات" value="100" class="input-field">
          <input type="number" id="reward-gems" placeholder="الجواهر" value="5" class="input-field">
        </div>
        <input type="text" id="reward-title" placeholder="لقب الجائزة (اختياري)" class="input-field">
        <button class="btn btn-primary" onclick="addNewStage()">إضافة المرحلة</button>
      </div>

      <!-- إدارة الحذف -->
      <div class="card">
        <h4>إدارة وحذف العوالم والمراحل</h4>
        <div id="admin-manage-list"></div>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
